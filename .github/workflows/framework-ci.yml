name: Framework CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install engine and tests
        run: python -m pip install -e tooling/blueprint_engine pytest
      - name: Run engine tests
        run: pytest tooling/blueprint_engine/tests
      - name: Check Mermaid bridge JavaScript syntax
        run: node --check tooling/blueprint_engine/node/mermaid_bridge.mjs

id: format.uml
kind: format-family
version: 0.3.0
status: experimental
title: Unified Modeling Language (UML)
semantic_strictness: formal
role: tool-neutral semantic modeling family
language_definition: language-definitions/uml/manifest.yaml
native_domains: [software, systems, architecture, behavior]
diagram_catalog: formats/uml/diagram-types.yaml
notes:
  - UML is a representation family, not a single text serialization or renderer.
  - Concrete serializations and renderer/tool integrations are separate adapters.
  - Normative validation and version compatibility require an explicitly pinned UML specification release.
representation_bindings: representation-bindings/registry.yaml
format_versions: format-versions/registry.yaml
renderer_policy:
  compatibility: explicit-contract-required
  style_realization: renderer-dependent
specification_ingestion:
  normalized_definition: language.uml
  adapter_registry: adapters/specification/uml.yaml
  planned_source_kinds: [metamodel-source, constraint-source, serialization-source, documentation-source]

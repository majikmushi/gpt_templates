id: format.uml.class
kind: format
version: 0.2.0
status: experimental
title: UML Class Diagram
family: format.uml
semantic_strictness: formal
capabilities:
  elements: [class, interface, enumeration, datatype, package, association-class, stereotype]
  members: [attribute, operation, visibility, static, abstract, generic-type]
  relationships: [association, dependency, generalization, realization, aggregation, composition, multiplicity]
  extension: [stereotype, tagged-value, constraint, note]
representation_bindings: representation-bindings/registry.yaml
format_versions: format-versions/registry.yaml
validator: validator.uml
serialization: tool-dependent
renderer_compatibility: renderer-compatibility/registry.yaml

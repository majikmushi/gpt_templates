id: style-binding.mermaid.class
kind: style-binding
version: 1.0.0
status: source-aware
title: Abstract Style to Mermaid classDiagram
format: format.mermaid.class
supported_channels:
  - fill
  - stroke
  - text-colour
  - line-style
  - class-style
  - class-definition
  - direction
  - annotation
mappings:
  palette: classDef-or-style
  node_border: classDef-or-style
  node_fill: classDef-or-style
  typography_emphasis: annotation-or-supported-style
  connector_pattern: relation-line-type-when-semantic-safe
  layout_direction: direction
fallbacks:
  unsupported_typography: preserve-readable-text
  unsupported_connector_decoration: retain-semantic-edge-label
accessibility:
  semantic_colour_requires_non_colour_fallback: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-representation-engine"
version = "0.2.0"
description = "Transformer, validator, capability matching and semantic comparison engine for gpt_templates."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20"
]

[project.scripts]
blueprint-engine = "blueprint_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

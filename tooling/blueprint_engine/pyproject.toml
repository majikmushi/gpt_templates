[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-representation-engine"
version = "0.4.0"
description = "Version-aware abstract-model, representation-binding, style, renderer compatibility, transform and validation engine for gpt_templates."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "packaging>=24.0"
]

[project.scripts]
blueprint-engine = "blueprint_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
